name: 结构回归

on:
  push:
  workflow_dispatch:

jobs:
  structure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 安装依赖
        run: pip install -r requirements.txt
      - name: 结构回归（P7_STUB，不调用模型、不花钱）
        run: python test_structure.py
